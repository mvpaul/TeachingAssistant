name: TutorApp
options:
  bundleIdPrefix: com.yourteam.tutor
  deploymentTarget:
    iOS: "16.1"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  TutorApp:
    type: application
    platform: iOS
    sources:
      - TutorApp
      - Shared
    info:
      path: TutorApp/Info.plist
    entitlements:
      path: TutorApp/TutorApp.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourteam.tutor
    dependencies:
      - target: BroadcastExtension
        embed: true
      - target: TutorActivityWidget
        embed: true

  BroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
      - BroadcastExtension
      - Shared
    info:
      path: BroadcastExtension/Info.plist
    entitlements:
      path: BroadcastExtension/BroadcastExtension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourteam.tutor.BroadcastExtension

  TutorActivityWidget:
    type: app-extension
    platform: iOS
    sources:
      - TutorActivityWidget
      - Shared
    info:
      path: TutorActivityWidget/Info.plist
    entitlements:
      path: TutorActivityWidget/TutorActivityWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourteam.tutor.TutorActivityWidget
